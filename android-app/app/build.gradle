plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jay.movie'
    compileSdk 34

    defaultConfig {
        applicationId "com.jay.movie"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "1.12"
    }

    signingConfigs {
        release {
            storeFile file("../keystore.jks")
            storePassword "jaymovie123"
            keyAlias "jaymovie"
            keyPassword "jaymovie123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// 独立离线 App：零外部依赖，全部使用 Android 框架自带 API
// 数据（收藏/历史/播放源/Key）保存在手机本地 SharedPreferences，无任何数据库
